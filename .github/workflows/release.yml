name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check:vercel-config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_EXPECTED_ROOT_DIR: apps/docs

      - name: Detect pending changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with Changesets
        if: ${{ steps.changesets.outputs.has_changesets == 'true' && secrets.NPM_TOKEN != '' }}
        uses: changesets/action@v1
        with:
          publish: pnpm dlx @changesets/cli publish
          version: pnpm dlx @changesets/cli version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip publish (no changesets or missing NPM token)
        if: ${{ steps.changesets.outputs.has_changesets != 'true' || secrets.NPM_TOKEN == '' }}
        run: |
          echo "Skipping publish."
          echo "has_changesets=${{ steps.changesets.outputs.has_changesets }}"
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is not configured."
          fi
